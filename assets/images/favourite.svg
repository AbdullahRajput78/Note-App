<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0EEE6"/>
      <stop offset="100%" stop-color="#E8E5DB"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4361EE"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="180" r="130" fill="#FAF9F6"/>

  <!-- Floating dots -->
  <circle cx="90" cy="90" r="6" fill="#EAF0FF"/>
  <circle cx="320" cy="120" r="8" fill="#EDEBFF"/>
  <circle cx="70" cy="260" r="5" fill="#EDEBFF"/>
  <circle cx="330" cy="270" r="6" fill="#EAF0FF"/>

  <!-- Stack of note cards -->
  <rect x="110" y="140" width="180" height="130" rx="16" fill="url(#cardGrad)" filter="url(#softShadow)" transform="rotate(-6 200 205)"/>
  <rect x="110" y="140" width="180" height="130" rx="16" fill="#FFFFFF" filter="url(#softShadow)" transform="rotate(4 200 205)"/>

  <!-- Lines on top card -->
  <g transform="rotate(4 200 205)">
    <rect x="135" y="170" width="90" height="8" rx="4" fill="#E0DED6"/>
    <rect x="135" y="190" width="130" height="6" rx="3" fill="#EDEBE3"/>
    <rect x="135" y="206" width="110" height="6" rx="3" fill="#EDEBE3"/>
    <rect x="135" y="222" width="70" height="6" rx="3" fill="#EDEBE3"/>
  </g>

  <!-- Dashed outlined star -->
  <path d="M200 128
           L212 165
           L251 165
           L219 188
           L231 226
           L200 202
           L169 226
           L181 188
           L149 165
           L188 165
           Z"
        fill="none" stroke="url(#starGrad)" stroke-width="4"
        stroke-linejoin="round" stroke-dasharray="7 6" opacity="0.9"/>

  <!-- Small plus badge -->
  <circle cx="255" cy="145" r="20" fill="url(#starGrad)" filter="url(#softShadow)"/>
  <rect x="248" y="143" width="14" height="4" rx="2" fill="#FFFFFF"/>
  <rect x="253" y="138" width="4" height="14" rx="2" fill="#FFFFFF"/>

  <!-- Text -->
  <text x="200" y="345" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#212529" text-anchor="middle">No favourites yet</text>
  <text x="200" y="372" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8A8378" text-anchor="middle">Tap the star on a note to add it here</text>
</svg>
