<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0EEE6"/>
      <stop offset="100%" stop-color="#E3E0D4"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4361EE"/>
    </linearGradient>
    <filter id="softShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="180" r="130" fill="#FAF9F6"/>

  <!-- Floating dots -->
  <circle cx="85" cy="95" r="6" fill="#EAF0FF"/>
  <circle cx="325" cy="115" r="8" fill="#EDEBFF"/>
  <circle cx="75" cy="265" r="5" fill="#EDEBFF"/>
  <circle cx="330" cy="260" r="6" fill="#EAF0FF"/>

  <!-- Box body -->
  <rect x="120" y="175" width="160" height="110" rx="12" fill="url(#boxGrad)" filter="url(#softShadow2)"/>

  <!-- Box lines (folded flap) -->
  <path d="M120 195 L160 175 L240 175 L280 195 Z" fill="#E8E5D9"/>

  <!-- Box lid -->
  <rect x="105" y="150" width="190" height="34" rx="10" fill="url(#lidGrad)" filter="url(#softShadow2)"/>

  <!-- Lid handle -->
  <rect x="180" y="140" width="40" height="14" rx="7" fill="#FFFFFF" opacity="0.9"/>

  <!-- Dashed arrow going into box -->
  <path d="M200 95 L200 140" fill="none" stroke="#B8B2A3" stroke-width="3" stroke-dasharray="5 5" stroke-linecap="round"/>
  <path d="M188 128 L200 143 L212 128" fill="none" stroke="#B8B2A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small document icon above -->
  <rect x="182" y="60" width="36" height="44" rx="4" fill="#FFFFFF" filter="url(#softShadow2)"/>
  <rect x="189" y="70" width="22" height="4" rx="2" fill="#E0DED6"/>
  <rect x="189" y="80" width="22" height="4" rx="2" fill="#EDEBE3"/>
  <rect x="189" y="90" width="14" height="4" rx="2" fill="#EDEBE3"/>

  <!-- Text -->
  <text x="200" y="345" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#212529" text-anchor="middle">Archive is empty</text>
  <text x="200" y="372" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8A8378" text-anchor="middle">Archived notes will show up here</text>
</svg>
