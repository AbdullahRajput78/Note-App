<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0EEE6"/>
      <stop offset="100%" stop-color="#E8E5DB"/>
    </linearGradient>
    <linearGradient id="fabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4361EE"/>
    </linearGradient>
    <filter id="softShadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="180" r="130" fill="#FAF9F6"/>

  <!-- Floating dots -->
  <circle cx="88" cy="92" r="6" fill="#EAF0FF"/>
  <circle cx="322" cy="118" r="8" fill="#EDEBFF"/>
  <circle cx="72" cy="262" r="5" fill="#EDEBFF"/>
  <circle cx="328" cy="265" r="6" fill="#EAF0FF"/>

  <!-- Stack of blank note cards -->
  <rect x="115" y="150" width="170" height="120" rx="16" fill="url(#cardGrad2)" filter="url(#softShadow3)" transform="rotate(-5 200 210)"/>
  <rect x="115" y="150" width="170" height="120" rx="16" fill="#FFFFFF" filter="url(#softShadow3)" transform="rotate(3 200 210)"/>

  <!-- Dashed lines suggesting empty content -->
  <g transform="rotate(3 200 210)">
    <rect x="140" y="180" width="120" height="7" rx="3.5" fill="#EDEBE3" stroke="#DEDBD1" stroke-width="1" stroke-dasharray="3 3"/>
    <rect x="140" y="198" width="90" height="7" rx="3.5" fill="#EDEBE3" stroke="#DEDBD1" stroke-width="1" stroke-dasharray="3 3"/>
    <rect x="140" y="216" width="105" height="7" rx="3.5" fill="#EDEBE3" stroke="#DEDBD1" stroke-width="1" stroke-dasharray="3 3"/>
  </g>

  <!-- Pencil -->
  <g transform="rotate(45 245 130)">
    <rect x="235" y="90" width="16" height="70" rx="4" fill="#FFFFFF" filter="url(#softShadow3)"/>
    <rect x="235" y="90" width="16" height="18" rx="4" fill="url(#fabGrad)"/>
    <path d="M235 160 L251 160 L243 175 Z" fill="#C9A876"/>
  </g>

  <!-- Plus FAB badge -->
  <circle cx="255" cy="255" r="24" fill="url(#fabGrad)" filter="url(#softShadow3)"/>
  <rect x="246" y="253" width="18" height="4" rx="2" fill="#FFFFFF"/>
  <rect x="253" y="246" width="4" height="18" rx="2" fill="#FFFFFF"/>

  <!-- Text -->
  <text x="200" y="345" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#212529" text-anchor="middle">No notes yet</text>
  <text x="200" y="372" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8A8378" text-anchor="middle">Tap + to create your first note</text>
</svg>
